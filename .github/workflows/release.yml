name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read the workspace version
        id: version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Version ${VERSION} is already released - nothing to do"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${VERSION} is new - preparing release ${TAG}"
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run the test suite
        if: steps.version.outputs.release == 'true'
        run: cargo test --release --quiet

      - name: Push the release tag
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the draft release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --generate-notes \
            --title "toJohn ${{ steps.version.outputs.tag }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            archive: tar.gz
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package the binary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          NAME="tojohn"
          if [[ "${TARGET}" == *windows* ]]; then
            NAME="tojohn.exe"
          fi
          STAGE="tojohn-v${VERSION}-${PLATFORM}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/${NAME}" "${STAGE}/"
          cp LICENSE README.md README_CN.md "${STAGE}/"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            7z a -tzip "${STAGE}.zip" "${STAGE}"
          else
            tar czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          echo "asset=${STAGE}.${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "${{ env.asset }}" --clobber

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false

  crates:
    name: Publish to crates.io
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the crates.io publication state
        id: crates
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'tojohn-release-workflow' \
            "https://crates.io/api/v1/crates/tojohn/${VERSION}")"
          if [[ "${STATUS}" == "200" ]]; then
            echo "tojohn ${VERSION} is already published - skipping"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tojohn ${VERSION} is not on crates.io yet"
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish the library crate
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tojohn

      - name: Wait for the index to update
        if: steps.crates.outputs.published != 'true'
        run: sleep 15

      - name: Publish the CLI crate
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tojohn-cli
